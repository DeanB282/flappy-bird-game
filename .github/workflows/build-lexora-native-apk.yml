          unzip -q lexora-native-android-ci.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: lexora-native-android-ci
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p out
          cp lexora-native-android-ci/app/build/outputs/apk/debug/app-debug.apk out/Lexora-Native-v3.0-debug.apk
          ls -lh out/Lexora-Native-v3.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexora-Native-v3.0-debug-apk
          path: out/Lexora-Native-v3.0-debug.apk
          if-no-files-found: error
